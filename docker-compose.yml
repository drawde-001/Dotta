services:
  caddy:
    image: caddy:2.8-alpine
    container_name: omni_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PUBLIC_DOMAIN=${DOMAIN:-${PUBLIC_DOMAIN:-omni-ai-agent.duckdns.org}}
    volumes:
      - ./server/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - omni_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omni_app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DEFAULT_MODEL=${DEFAULT_MODEL:-meta-muse-spark}
      - META_MUSE_API_KEY=${META_MUSE_API_KEY:-}
      - META_MUSE_BASE_URL=${META_MUSE_BASE_URL:-https://api.meta.ai/v1}
      - META_MUSE_MODEL=${META_MUSE_MODEL:-muse-spark-1.3}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
    networks:
      - omni_network

volumes:
  caddy_data:
  caddy_config:

networks:
  omni_network:
    driver: bridge
