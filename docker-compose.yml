services:
  caddy:
    image: caddy:2.8-alpine
    container_name: dotta_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PUBLIC_DOMAIN=${DOMAIN:-${PUBLIC_DOMAIN:-dotta.duckdns.org}}
    volumes:
      - ./server/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - dotta_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dotta_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DEFAULT_MODEL=${DEFAULT_MODEL:-muse-spark-open}
      - META_MUSE_API_KEY=${META_MUSE_API_KEY:-}
      - META_MUSE_BASE_URL=${META_MUSE_BASE_URL:-https://api.meta.ai/v1}
      - META_MUSE_MODEL=${META_MUSE_MODEL:-muse-spark-open}
      - MODAL_MUSE_SPARK_URL=${MODAL_MUSE_SPARK_URL:-}
      - MODAL_PROXY_TOKEN_ID=${MODAL_PROXY_TOKEN_ID:-}
      - MODAL_PROXY_TOKEN_SECRET=${MODAL_PROXY_TOKEN_SECRET:-}
      - MODEL_API_KEY=${MODEL_API_KEY:-}
      - MUSE_API_KEY=${MUSE_API_KEY:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
    volumes:
      # Mount .env so runtime key loaders find it directly
      - ./.env:/app/.env:ro
      # Persist BIO data, user sandboxes, thread state and session secret
      # across container rebuilds/redeploys (otherwise every deploy wipes them)
      - bio_data:/app/src/data
      - workspaces_data:/app/src/workspaces
    networks:
      - dotta_network

volumes:
  caddy_data:
  caddy_config:
  bio_data:
  workspaces_data:

networks:
  dotta_network:
    driver: bridge
