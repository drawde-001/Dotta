name: Deploy to EC2 Production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Omni Agent Stack
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Docker Compose Stack
        run: |
          echo "Syncing server-side .env..."
          if [ -f /home/ubuntu/omni-agent/.env ]; then
            cp /home/ubuntu/omni-agent/.env .env
          fi
          echo "Starting production stack deployment..."
          docker compose down --remove-orphans || true
          docker compose build --no-cache app
          docker compose up -d

      - name: Verify Container Health
        run: |
          echo "Awaiting services health check..."
          sleep 15
          docker compose ps
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:3001/api/health || (docker compose logs && exit 1)
          echo "Omni Agent production deployment healthy and online."
