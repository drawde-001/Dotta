name: Deploy to EC2 Production

on:
  push:
    branches:
      - main
      - master

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Dotta Stack
    runs-on: self-hosted

    steps:
      - name: Pull Latest Code & Rebuild Production Container
        run: |
          cd /home/ubuntu/dotta
          git fetch origin main
          git checkout -B main origin/main
          git reset --hard origin/main
          docker compose up -d --build app

      - name: Verify Container Health
        run: |
          cd /home/ubuntu/dotta
          sleep 10
          docker compose ps
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:3001/api/health || (docker compose logs app && exit 1)
          echo "Dotta production deployment healthy and online."
